; Dedicated hardware target. Does NOT use the legacy TFT firmware/config.
[platformio]
default_envs = xiao-oled
src_dir = firmware/xiao_oled
include_dir = firmware/xiao_oled
lib_dir = firmware/xiao_oled/local_libs

[env:xiao-oled]
platform = espressif32@7.1.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<main.cpp>
build_flags =
    -Wall
    -Wextra
    -DBOARD_HAS_PSRAM
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.12.1
    bblanchon/ArduinoJson@6.21.5
upload_protocol = esptool
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_build.f_cpu = 240000000L
