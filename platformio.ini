[platformio]
default_envs = seeed-xiao-esp32s3

[env:seeed-xiao-esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build options
build_flags =
    -DBOARD_SEEED_XIAO_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_FS_H_WARNING=1
    -Wall
    -Wextra
    -O2
    -std=c++17
    -fno-exceptions
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

; Memory configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Library dependencies
; TFT_eSPI provides ILI9488/ST7796 drivers + TFT_eSPI class used by DisplayManager
; FFT: ESP-DSP (im SDK enthalten, S3-hardwareoptimiert) — kein arm_math/CMSIS nötig
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    SdFat
    ArduinoBLE

; Serial monitor configuration
monitor_filters =
    time
    log2file
    colorize

; OTA update support
upload_protocol = esptool

; Debug configuration
debug_tool = esp-builtin

[env:release]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
inherit_from = env:seeed-xiao-esp32s3
build_flags =
    ${env:seeed-xiao-esp32s3.build_flags}
    -O3
    -DNDEBUG

[env:debug]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
inherit_from = env:seeed-xiao-esp32s3
build_flags =
    ${env:seeed-xiao-esp32s3.build_flags}
    -O0
    -g
    -DDEBUG_BUILD
